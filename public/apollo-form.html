<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GroupGrid signup form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; }
    #apollo-forms { min-height: 40px; }
  </style>
</head>
<body>
  <!-- Standalone Apollo form document, loaded via same-origin iframe from the site.
       Isolating Apollo in its own document keeps its DOM injection away from the
       React app, so a form issue can never crash the page. The parent hides the
       whole section until this document reports that the form actually rendered
       (Apollo refuses to render on domains not authorized in its form settings). -->
  <div id="apollo-forms"></div>
  <script>
    (function () {
      var host = document.getElementById("apollo-forms");
      function rendered() {
        // Apollo injects its form markup into #apollo-forms; empty means it declined to render.
        return !!(host && host.children.length > 0);
      }
      function report() {
        try {
          parent.postMessage({ __ggApollo: true, ready: rendered(), height: document.body.scrollHeight }, window.location.origin);
        } catch (e) {}
      }
      var nocache = Math.random().toString(36).substring(7);
      var s = document.createElement("script");
      s.src = "https://assets.apollo.io/js/apollo-inbound.js?nocache=" + nocache;
      s.async = true;
      s.onload = function () {
        try { window.ApolloInbound.forms.init({ appId: "6a9a41cb6781930010d627ee" }); }
        catch (err) { console.error("[Apollo] init error:", err); }
        setTimeout(report, 400);
        setTimeout(report, 1200);
      };
      s.onerror = function () { console.error("[Apollo] failed to load form script"); report(); };
      document.head.appendChild(s);
      if (host && window.MutationObserver) {
        new MutationObserver(report).observe(host, { childList: true, subtree: true });
      }
      window.addEventListener("load", report);
      setInterval(report, 1000);
    })();
  </script>
</body>
</html>
